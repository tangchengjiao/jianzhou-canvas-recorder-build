name: Build macOS Universal Beta

on:
  workflow_dispatch:
  push:
    branches:
      - codex/macos-beta

permissions:
  contents: read

jobs:
  build-macos:
    name: macOS Universal DMG
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CI: "true"
      APPLE_SIGNING_IDENTITY: "-"

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Browser regression suite
        run: pnpm verify
        env:
          EDGE_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome

      - name: Build Universal app and DMG
        run: pnpm desktop:build:mac

      - name: Launch packaged application
        shell: bash
        run: |
          APPS=(src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app)
          APP_PATH="${APPS[0]}"
          test -d "$APP_PATH"
          "$APP_PATH/Contents/MacOS/jianzhou-canvas-recorder" > /tmp/jianzhou-macos-launch.log 2>&1 &
          APP_PID=$!
          for attempt in {1..10}; do
            if kill -0 "$APP_PID" 2>/dev/null; then
              sleep 1
            else
              cat /tmp/jianzhou-macos-launch.log
              exit 1
            fi
          done
          kill "$APP_PID"
          wait "$APP_PID" || true

      - name: Verify and package macOS release
        run: pnpm desktop:package:mac

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jianzhou-canvas-recorder-macos-universal-beta
          path: artifacts/macos/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish macOS installer to Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")
          TAG="v${VERSION}"
          RELEASE_DIR="artifacts/macos/jianzhou-canvas-recorder-beta-${VERSION}-macos-universal"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "见舟画布录制 ${VERSION} · Beta" \
              --prerelease --notes "macOS 内测安装包。使用说明与各平台下载入口见仓库 README；Windows 安装包按平台构建后补充。"
          fi
          cp "$RELEASE_DIR/USER_MANUAL-使用手册.pdf" "$RELEASE_DIR/Jianzhou-Canvas-Recorder-User-Manual.pdf"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$RELEASE_DIR/Jianzhou-Canvas-Recorder-Beta-${VERSION}-macOS-Universal.dmg" \
            "$RELEASE_DIR/Jianzhou-Canvas-Recorder-User-Manual.pdf" \
            MACOS_BETA.md PRIVACY.md THIRD_PARTY_NOTICES.md
